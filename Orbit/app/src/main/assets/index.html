<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Park Universe</title>
<link href="vendor/mapbox-gl.css" rel="stylesheet">
<style>
:root{--glass:rgba(10,18,30,.78);--glass2:rgba(16,28,44,.92);--line:rgba(255,255,255,.14);--ink:#eef6ff;--mut:#9fb6cc;--acc:#4ee1a0;--acc2:#ffc857;--pool:#22d3ee;--snow:#7cc8ff;--danger:#ff7a6b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#05080d;color:var(--ink);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
#map{position:fixed;inset:0}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.45)}
/* top bar */
.top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;display:flex;align-items:flex-start;gap:8px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;font-weight:800;letter-spacing:.2px}
.brand svg{width:26px;height:26px;flex:none}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut);letter-spacing:0;margin-top:-2px}
.sp{flex:1}
.rbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px}
#bMe{font-size:17px;color:#7cc0ff}#bMe:active{background:#1e88ff}
.rcol{display:flex;flex-direction:column;gap:8px}
.rbtn[aria-pressed=true]{background:var(--acc);color:#04241a;border-color:transparent}
/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:22px;z-index:5;max-width:calc(100% - 20px)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;white-space:nowrap;padding:7px 8px;border:0;border-radius:16px;background:none;font-size:11.5px;font-weight:700;color:var(--mut)}
.dock button i{font-style:normal;font-size:21px;line-height:1;color:var(--ink)}
.dock button:active,.dock button.on{background:rgba(255,255,255,.1);color:var(--ink)}
.dock .fly i{color:var(--acc2)}
/* place card */
.card{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));border-radius:20px;padding:14px 14px 12px;z-index:6;max-width:520px;margin:0 auto;max-height:52vh;overflow:auto}
.card h2{margin:0 34px 2px 0;font-size:20px;line-height:1.2}
.cat{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.addr{margin:8px 0 6px;font-size:14px}
.am{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}.am span{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;padding:1px 8px;font-size:12.5px}
.x{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:16px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btns a,.btns button{flex:1 1 0;min-width:0;text-align:center;padding:9px 6px;border-radius:12px;text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--line);color:var(--ink);background:rgba(255,255,255,.06);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns .p{background:linear-gradient(135deg,#34d399,#22d3ee);color:#03221a;border-color:transparent}
.btns .ic{flex:0 0 42px}
.btns .fv[aria-pressed=true]{color:var(--acc2);border-color:var(--acc2)}
.src{font-size:11.5px;color:var(--mut);margin:8px 0 0}
/* sheet: places list */
.sheet{position:fixed;left:0;right:0;bottom:0;height:68vh;border-radius:22px 22px 0 0;z-index:8;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);max-width:640px;margin:0 auto}
.sh{padding:12px 14px 8px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--line)}
.shrow{display:flex;align-items:center;gap:8px}
.shrow h3{margin:0;font-size:17px;flex:1}
.flyl{border:0;border-radius:10px;padding:7px 11px;background:var(--acc2);color:#2a1d00;font-weight:800;font-size:13px}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:inherit;outline:none}
.search:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13px;font-weight:700;color:var(--mut)}
.chips button[aria-pressed=true]{background:var(--ink);color:#08121c;border-color:transparent}
.list{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none}
.row .dot{margin-top:6px}
.row b{display:block;font-size:15.5px}.row small{display:block;color:var(--mut);font-size:13px;margin-top:1px}
.row:active{background:rgba(255,255,255,.06)}
.empty{padding:28px 16px;color:var(--mut);text-align:center}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:7}
/* tour */
.tour{position:fixed;left:10px;right:10px;top:calc(64px + env(safe-area-inset-top,0px));max-width:520px;margin:0 auto;border-radius:18px;padding:10px 12px;z-index:6;display:flex;align-items:center;gap:10px}
.tour .tt{flex:1;min-width:0}
.tour .tt small{display:block;color:var(--acc2);font-weight:800;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase}
.tour .tt b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tour .tt span{display:block;color:var(--mut);font-size:12.5px}
.tc{display:flex;gap:4px}
.tc button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:15px}
.tc .pl{background:var(--acc2);color:#2a1d00;border-color:transparent}
.bar{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);width:0;transition:width .4s}
.touring .dock,.touring .card{display:none!important}
.touring .toast{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
/* apps drawer */
.drawer{position:fixed;inset:0;z-index:9;background:rgba(5,9,15,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(12px + env(safe-area-inset-bottom,0px))}
.dhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dhead .search{flex:1}
.dsec{color:var(--mut);font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;margin:12px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:6px 2px;border-radius:14px;font-size:12px;text-align:center;line-height:1.2}
.app:active{background:rgba(255,255,255,.08)}
.app img,.app .ai{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:26px}
.app .ai{background:var(--c,#2b3d52)}
.app .ai3{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(0,0,0,.35);overflow:hidden}
.app .ai3 img{width:100%;height:100%;border-radius:0;transform:scale(1.18)}
.app span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.dscroll{flex:1;overflow:auto}
/* menu */
.menu{position:fixed;right:12px;top:calc(160px + env(safe-area-inset-top,0px));border-radius:16px;padding:6px;z-index:8;min-width:220px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:10px;background:none;text-align:left;font-size:14.5px}
.menu button:active{background:rgba(255,255,255,.08)}
.menu i{font-style:normal;width:22px;text-align:center}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
/* misc */
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#0b1520;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;z-index:20;max-width:92%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.note{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top,0px));z-index:6;padding:12px 14px;border-radius:14px;font-size:14px;max-width:520px;margin:0 auto}
.moving{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:6;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:700;max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center;background:var(--acc2);color:#2a1d00}
.moving span{flex:1}
.xhair{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;z-index:6;pointer-events:none}
.xhair i,.xhair b{position:absolute;background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.65)}
.xhair i{left:31px;top:0;width:2px;height:64px}.xhair b{top:31px;left:0;height:2px;width:64px}
.xhair:after{content:"";position:absolute;left:24px;top:24px;width:12px;height:12px;border:2px solid #ffe066;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}
.placebar{position:fixed;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:18px;padding:10px 12px;max-width:520px;margin:0 auto}
.pbinfo{font-size:13px;color:var(--mut);margin-bottom:8px;text-align:center}
.pbbtns{display:flex;gap:6px}.pbbtns button{flex:1;white-space:nowrap;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:800;font-size:13.5px}
.pbbtns .p{flex:1.3;background:linear-gradient(135deg,#34d399,#22d3ee);color:#03221a;border-color:transparent}
.placing .dock,.placing .card,.placing .top .rcol{display:none!important}.moving button{border:0;border-radius:10px;padding:6px 12px;background:rgba(0,0,0,.18);font-weight:800}
.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.mapboxgl-ctrl-logo{opacity:.7}
/* snow page */
.snow{position:fixed;inset:0;background:#08121c;overflow:auto;z-index:10;padding-top:env(safe-area-inset-top,0px)}
.snow .hd{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:12px;background:#08121c;border-bottom:1px solid var(--line);z-index:2}
.snow .hd button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;padding:6px 12px}
.sb{padding:14px 16px 32px;max-width:720px;margin:0 auto}
.sb h2{margin:0}.sb h3{margin:20px 0 8px;font-size:16px}.mut{color:var(--mut);margin:2px 0}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph div,.ph img{aspect-ratio:4/3;width:100%;object-fit:cover;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mut)}
.bx{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.04)}.bx b{display:block}.tbc{font-size:12px;color:var(--mut)}
.dd{display:grid;gap:10px}.dd section{border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.dd h4{margin:0 0 4px}.dd ul{margin:0;padding-left:20px}.dd li{margin:3px 0}.do h4{color:var(--acc)}.dont h4{color:var(--danger)}
.fine{font-size:12px;color:var(--mut);margin-top:12px}
@media (min-width:900px){.card{left:auto;right:16px;bottom:auto;top:calc(74px + env(safe-area-inset-top,0px));width:400px;max-height:80vh}.sheet{left:16px;right:auto;width:400px;top:calc(74px + env(safe-area-inset-top,0px));bottom:96px;height:auto;border-radius:22px}}
</style>

  var k=0;function next(){if(k>=q.length)return;var i=q[k++],p=PL[i],ref=p.ll.slice();
    fetch("https://api.mapbox.com/search/geocode/v6/forward?q="+encodeURIComponent(p.addr)+"&proximity=-104.889,39.770&bbox=-104.93,39.74,-104.84,39.83&country=us&limit=1&access_token="+TOKEN)
    .then(function(r){return r.json()}).then(function(j){var f=j.features&&j.features[0];
      if(f&&f.geometry&&f.geometry.coordinates&&!OVR[p.n]){var c=f.geometry.coordinates;if(dkm(c,ref)<4){p.ll=c;p.src=1;GEO[p.n]=c;LS.set("geo2",GEO);refresh()}}})
    .catch(function(){}).then(next)}
  for(var w=0;w<4&&w<q.length;w++)next();
}

function padFor(){var w=window.innerWidth;return w>=900?{right:420,top:40,bottom:40,left:40}:{bottom:Math.round(window.innerHeight*.32),top:40,left:20,right:20}}
function showCard(i){var p=PL[i],c=catOf(p),q=p.addr||(p.n+", Central Park, Denver, CO 80238"),el=$("card");
  el.innerHTML='<button class="x" id="cX" aria-label="Close">&#10005;</button><h2></h2><span class="cat"><span class="dot" style="--c:'+c[1]+'"></span><span id="cC"></span></span>'+
   '<p class="addr" id="cA"></p><div class="am" id="cAm"></div><div class="btns">'+

  $("cA").textContent=(p.addr||"").replace(/^R42G\+JG, /,"Plus code R42G+JG, ");
  p.am.split(", ").forEach(function(a){var s=document.createElement("span");s.textContent=a;$("cAm").appendChild(s)});
  $("cDir").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
  $("cMca").href="https://www.mca80238.com/facilities/"+p.mca;
  var fv=$("cFv");fv.textContent=FAV[p.n]?"\u2605":"\u2606";fv.setAttribute("aria-pressed",!!FAV[p.n]);
  fv.onclick=function(){if(FAV[p.n])delete FAV[p.n];else FAV[p.n]=1;LS.set("fav5",FAV);refresh();showCard(i);if(!$("sheet").hidden)drawList()};
  $("cSn").onclick=function(){openSnow(i)};
  if(window.PUAssets){var by=PUAssets.counts(p.n),tot=Object.keys(by).reduce(function(t,k){return t+by[k]},0);$("cAs").textContent="Assets ("+tot+")";
    $("cAs").onclick=function(){PUAssets.openList({park:p.n})};$("cAdd").onclick=function(){PUAssets.startAdd({park:p.n})};
    if(tot){var sm=document.createElement("div");sm.className="am";Object.keys(by).forEach(function(k){var sp=document.createElement("span");sp.innerHTML='<img alt="" src="'+PUAssets.iconURL(k)+'" style="width:15px;height:15px;vertical-align:-3px"> '+by[k]+" "+PUAssets.T[k].name.toLowerCase();sm.appendChild(sp)});$("cSrc").parentNode.insertBefore(sm,$("cSrc"))}}
  else{$("cAs").parentNode.hidden=true}$("cMv").onclick=function(){startMove(i)};$("cX").onclick=closeCard;
  $("cSrc").textContent=p.src===2?"Pin: exact location":p.src===1?"Pin: from the street address":"Pin: approximate \u2014 tap \ud83d\udccd to place it exactly";
  el.hidden=false;
}

var prevLook=null;
function moveMode(msg,cb,o){o=o||{};closeCard();if(tour)tourStop();moveCb=cb;moving=-2;$("movT").textContent=msg;$("moving").hidden=false;

/* ---------------- places list ---------------- */
var filt="all";
var FILTERS=[["all","All"],["park","Parks"],["pool","Pools"],["fav","Saved \u2605"],["large","Large"],["sports","Sports"],["water","Water"],["small","Small"]];
function match(p){var q=$("q").value.trim().toLowerCase();if(q&&(p.n+" "+p.am+" "+p.addr).toLowerCase().indexOf(q)<0)return false;
  return filt==="all"||(filt==="park"&&!p.pool)||(filt==="pool"&&p.pool)||(filt==="fav"&&FAV[p.n])||p.cat===filt}
function shown(){var a=[];PL.forEach(function(p,i){if(match(p))a.push(i)});return a}
function drawChips(){var c=$("chips");c.innerHTML="";FILTERS.forEach(function(f){var b=document.createElement("button");b.textContent=f[1];b.setAttribute("aria-pressed",filt===f[0]);b.onclick=function(){filt=f[0];drawChips();drawList()};c.appendChild(b)})}
function drawList(){var l=$("list"),a=shown();l.innerHTML="";
  $("sheetT").textContent=a.length+(a.length===1?" place":" places");
  if(!a.length){l.innerHTML='<div class="empty">Nothing matches. Try another search or filter.</div>';return}
  a.sort(function(x,y){var px=PL[x],py=PL[y];return (py.pool-px.pool)||px.n.localeCompare(py.n)});
  a.forEach(function(i){var p=PL[i],c=catOf(p),b=document.createElement("button");b.className="row";
    b.innerHTML='<span class="dot" style="--c:'+c[1]+'"></span><span><b></b><small></small></span>';
    b.querySelector("b").textContent=p.n+(FAV[p.n]?" \u2605":"");b.querySelector("small").textContent=c[0]+" \u00b7 "+p.am;
    b.onclick=function(){closeSheet();if(tour)tourStop();pick(i)};l.appendChild(b)})}
function openSheet(){closeAll();$("scrim").hidden=false;$("sheet").hidden=false;drawChips();drawList();$("dPlaces").classList.add("on")}

$("q").oninput=drawList;$("sheetX").onclick=closeSheet;$("scrim").onclick=closeSheet;$("dPlaces").onclick=function(){$("sheet").hidden?openSheet():closeSheet()};

/* ---------------- fly-over tour ---------------- */
var tour=null,tid=0,SPEEDS=[1,1.6,.6],spd=0;
function route(list){ /* short path: always fly to the nearest place not yet visited */
  if(!list.length)return[];var left=list.slice(),start=0,cp=PL.map(function(p){return p.n}).indexOf("Central Park");
  if(map){var c=map.getCenter(),best=1e9;left.forEach(function(i,k){var d=dkm([c.lng,c.lat],PL[i].ll);if(d<best){best=d;start=k}})}
  if(cp>=0&&left.indexOf(cp)>=0&&(!map||map.getZoom()<13))start=left.indexOf(cp);
  var out=[left.splice(start,1)[0]];
  while(left.length){var last=PL[out[out.length-1]].ll,bk=0,bd=1e9;left.forEach(function(i,k){var d=dkm(last,PL[i].ll);if(d<bd){bd=d;bk=k}});out.push(left.splice(bk,1)[0])}
  return out}
function bearingTo(a,b){var y=Math.sin((b[0]-a[0])*Math.PI/180)*Math.cos(b[1]*Math.PI/180),x=Math.cos(a[1]*Math.PI/180)*Math.sin(b[1]*Math.PI/180)-Math.sin(a[1]*Math.PI/180)*Math.cos(b[1]*Math.PI/180)*Math.cos((b[0]-a[0])*Math.PI/180);return Math.atan2(y,x)*180/Math.PI}
function tourStart(only){
  if(!map){toast("The map isn't loaded yet.");return}
  var list=only?shown():PL.map(function(_,i){return i});
  if(!list.length){toast("No places to fly to. Change the filter.");return}
  closeAll();endMove();
  tour={order:route(list),k:0,paused:false};window.PU3D&&PU3D.setAnimate(true);document.body.classList.add("touring");$("tour").hidden=false;
  toast("Fly-over of "+tour.order.length+" places. Drag the map any time to pause.",3000);tourGo();
}
function tourUI(){var i=tour.order[tour.k],p=PL[i];
  $("tTag").textContent=(tour.paused?"Paused":"Flying to")+" \u00b7 "+(tour.k+1)+" of "+tour.order.length;
  $("tName").textContent=p.n;$("tSub").textContent=catOf(p)[0]+" \u00b7 "+p.am;
  $("tPlay").innerHTML=tour.paused?"&#9654;":"&#10074;&#10074;";$("tPlay").setAttribute("aria-label",tour.paused?"Play":"Pause");
  $("tBar").style.width=((tour.k+1)/tour.order.length*100)+"%"}
function tourGo(){
  if(!tour)return;var id=++tid,i=tour.order[tour.k],p=PL[i],s=SPEEDS[spd];setSel(i);tourUI();if(tour.paused)return;
  var c=map.getCenter(),from=[c.lng,c.lat],dist=dkm(from,p.ll),b=dist>.05?bearingTo(from,p.ll):map.getBearing()+40;
  var dur=Math.min(7500,Math.max(2600,1800+dist*1500))/s;
  map.flyTo({center:p.ll,zoom:17.1,pitch:66,bearing:b,duration:dur,curve:1.42,speed:1.1,essential:true,padding:{top:120,bottom:40,left:0,right:0}});
  map.once("moveend",function(){if(!tour||id!==tid||tour.paused)return;
    map.easeTo({bearing:b+80,zoom:17.5,duration:6500/s,easing:function(t){return t},essential:true});
    map.once("moveend",function(){if(!tour||id!==tid||tour.paused)return;
      if(tour.k<tour.order.length-1){tour.k++;tourGo()}else{var n=tour.order.length;tourStop();toast("Fly-over complete \u2014 "+n+" places visited.");map.flyTo(Object.assign({},HOME,{duration:4000,essential:true}))}})})}
function tourPause(byUser){if(!tour)return;tour.paused=true;tid++;map.stop();tourUI();if(byUser)toast("Fly-over paused. Tap \u25b6 to keep going.")}
function tourResume(){if(!tour)return;tour.paused=false;tourGo()}
function tourStep(d){if(!tour)return;tour.k=(tour.k+d+tour.order.length)%tour.order.length;tid++;map.stop();tourGo()}
function tourStop(){if(!tour)return;[].forEach.call(document.querySelectorAll(".toast"),function(o){o.remove()});var i=tour.order[tour.k];tour=null;window.PU3D&&PU3D.setAnimate(false);tid++;map&&map.stop();document.body.classList.remove("touring");$("tour").hidden=true;if(i!=null)showCard(i)}
$("dFly").onclick=function(){tourStart(false)};$("flyList").onclick=function(){tourStart(true)};$("tPlay").onclick=function(){tour&&(tour.paused?tourResume():tourPause())};
$("tPrev").onclick=function(){tourStep(-1)};$("tNext").onclick=function(){tourStep(1)};$("tStop").onclick=tourStop;
$("tSpd").onclick=function(){spd=(spd+1)%SPEEDS.length;this.innerHTML=["1&times;","Fast","Slow"][spd];if(tour&&!tour.paused){tid++;map.stop();tourGo()}};
